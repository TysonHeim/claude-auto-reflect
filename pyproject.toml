[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-auto-reflect"
version = "0.2.0"
description = "Self-improvement feedback loop for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
# Zero external dependencies — stdlib only

[tool.setuptools.packages.find]
include = ["auto_reflect*"]

[project.scripts]
auto-reflect-analyze = "auto_reflect.analyze_session:main"
auto-reflect-detect = "auto_reflect.detect_patterns:main"
auto-reflect-propose = "auto_reflect.propose_improvements:main"
auto-reflect-proposals = "auto_reflect.proposals:main"
